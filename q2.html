<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Q2</title>
</head>
<body>

<button id="b1">
    addToCart
</button>

<script>
    let count = 0;

    const b1 = document.getElementById("b1");

    b1.addEventListener("click", () => {
        count++;
        alert("The number of items added to the cart are: " + count);
    });
</script>

</body>
</html>
